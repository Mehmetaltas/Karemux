name: Icerik Tutarlilik Denetimi

on:
  schedule:
    - cron: '0 6 * * 1'  # her Pazartesi 06:00 UTC (haftalik)
  workflow_dispatch:
  push:
    paths:
      - 'lib/kalite-referanslari.js'
      - 'app/api/admin/tutarlilik-denetimi/**'

jobs:
  denetim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Icerik tutarliligini denetle
        env:
          NEXT_PUBLIC_SITE_URL: https://www.karemux.com
          ULUSAL_DENEME_YONETICI_SIFRESI: ${{ secrets.ULUSAL_DENEME_YONETICI_SIFRESI }}
        run: node scripts/tutarlilik-denetimi-test.js
