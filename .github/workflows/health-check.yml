name: KAREMUX Health Check

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'  # her 6 saatte bir otomatik calisir (kod gonderilmese bile)

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Bagimliliklari kur
        run: npm ci
      - name: Health check calistir
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_SITE_URL: https://karemux-nu.vercel.app
          HEALTH_CHECK_SECRET: ${{ secrets.HEALTH_CHECK_SECRET }}
        run: node scripts/health-check.js
      - name: Basarisizlik bildirimi (Telegram)
        if: failure()
        run: |
          curl -s "https://api.telegram.org/bot${{ secrets.ADMIN_TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.ADMIN_TELEGRAM_CHAT_ID }}" \
            -d text="🔴 KAREMUX Health Check BASARISIZ OLDU. Detaylar: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
