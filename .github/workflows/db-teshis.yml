name: DB Teshis (salt okunur)

on:
  workflow_dispatch:

jobs:
  teshis:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/db-teshis.mjs
