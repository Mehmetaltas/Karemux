name: Mini Ders Videosu Uret

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'En fazla kac video (1-20)'
        default: '3'
      sessiz:
        description: 'true = sessiz uret (dis seslendirme icin); konusma metni .senaryo.json olarak gelir'
        default: 'false'
      onizleme:
        description: 'true = mp4 dosyalarini video-onizleme dalina koy (onay icin izleme)'
        default: 'false'
      sinif:
        description: 'Yalniz bu sinif (bos = hepsi)'
        default: ''
      dis_ses:
        description: 'true = repodaki dis-ses/<paket id>/s0.mp3... dosyalarini ses olarak kullan (gercek ogretmen sesi)'
        default: 'false'
      dis_ses_maliyet_tl:
        description: 'dis seslendirme video basina ucret (TL, bilinmiyorsa 0)'
        default: '0'
  schedule:
    - cron: '30 3 * * *'  # her gun kucuk parti; kayitlar yalniz 'kalite_bekliyor' acilir

permissions:
  contents: write

jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Araclar (ffmpeg, yazi tipi, playwright)
        timeout-minutes: 12
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -qq
          sudo apt-get -o Acquire::Retries=3 install -y -qq ffmpeg fonts-dejavu-core fonts-noto-core
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Uretim hattini sessiz sesle dogrula
        run: node scripts/mini-video-test.mjs
      - name: Mini videolari uret
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          HEALTH_CHECK_SECRET: ${{ secrets.HEALTH_CHECK_SECRET }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          LIMIT: ${{ inputs.limit || '3' }}
          SINIF: ${{ inputs.sinif }}
          SESSIZ: ${{ inputs.sessiz }}
          DIS_SES_DIZIN: ${{ inputs.dis_ses == 'true' && 'dis-ses' || '' }}
          DIS_SES_MALIYET_TL: ${{ inputs.dis_ses_maliyet_tl }}
        run: |
          npx --yes esbuild@0.25.0 scripts/mini-video-uret.mjs --bundle --platform=node --format=esm --alias:@=. --external:playwright --external:@neondatabase/serverless --external:@vercel/blob --outfile=mini-video-paket.mjs --log-level=warning
          node mini-video-paket.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mini-videolar
          path: |
            mini-video-cikti/*.mp4
            mini-video-cikti/*.senaryo.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Onizleme dalina koy
        if: inputs.onizleme == 'true'
        run: |
          set -e
          mkdir -p /tmp/onz && cp mini-video-cikti/*.mp4 mini-video-cikti/*.senaryo.json /tmp/onz/
          git config user.name "karemux-bot"; git config user.email "bot@karemux.com"
          git checkout --orphan video-onizleme
          git rm -rf -q . || true
          cp /tmp/onz/* .
          echo '{"git":{"deploymentEnabled":false}}' > vercel.json
          git add *.mp4 *.json vercel.json
          git commit -q -m "mini video onizleme [skip ci]"
          git push -f origin video-onizleme
