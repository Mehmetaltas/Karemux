name: WebAuthn Testi

on:
  workflow_dispatch:
  push:
    paths: ['lib/webauthn.js', 'scripts/webauthn-test.mjs', 'app/api/personel/passkey/**', 'package.json']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: node scripts/webauthn-test.mjs
