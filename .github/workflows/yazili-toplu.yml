name: Yazili Toplu Uretim

on:
  workflow_dispatch:
    inputs:
      sinif:
        description: "Sınıf (boş = hepsi)"
        required: false
        default: ""
      ogretim_yili:
        description: "Öğretim yılı etiketi (örn. 2027-2028; boş = tarihten otomatik)"
        required: false
        default: ""
  schedule:
    - cron: "0 6 1 9 *"   # her yıl 1 Eylül: yeni yıllık plana göre 180 yazılıyı yeniden üret + boşluk raporu

permissions:
  contents: write
  issues: write

jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm i --no-save --no-audit --no-fund playwright
      - run: npx playwright install --with-deps chromium
      - env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OGRETIM_YILI: ${{ inputs.ogretim_yili }}
        run: node scripts/yazili-toplu.mjs cikti "${{ inputs.sinif }}"
      - name: Boşluk raporunu issue olarak aç (yalnızca yıllık çalıştırmada)
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --title "Yazılı: yeni yıllık plan boşluk raporu $(date +%Y)" --body-file cikti/BOSLUK.txt || true
      - name: Sonuçları yazili-cikti dalına yaz
        run: |
          cd cikti && git init -q -b yazili-cikti && git config user.name "karemux-bot" && git config user.email "bot@karemux.com"
          echo '{"git":{"deploymentEnabled":false}}' > vercel.json
          git add -A && git commit -qm "yazili ciktilari [skip ci]"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" yazili-cikti
