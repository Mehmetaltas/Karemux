name: Eksik Konu Paketi Raporu

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rapor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Eksikleri say
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/eksik-konu-paketi-raporu.mjs
      - name: Uretim planini tohumla (video_uretim_plani)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npx --yes esbuild@0.25.0 scripts/video-plani-tohumla.mjs --bundle --platform=node --format=esm --alias:@=. --external:@neondatabase/serverless --outfile=plan-paket.mjs --log-level=error
          node plan-paket.mjs
      - name: Rapor dalina yaz
        run: |
          set -e
          cp eksik-konu-paketleri.json /tmp/rapor.json
          git config user.name "karemux-bot"; git config user.email "bot@karemux.com"
          git checkout --orphan rapor
          git rm -rf -q . || true
          cp /tmp/rapor.json eksik-konu-paketleri.json
          echo '{"git":{"deploymentEnabled":false}}' > vercel.json
          git add eksik-konu-paketleri.json vercel.json
          git commit -q -m "eksik konu paketi raporu [skip ci]"
          git push -f origin rapor
