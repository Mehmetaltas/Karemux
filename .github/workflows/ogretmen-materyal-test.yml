name: Ogretmen Materyal Araclari Testi

on:
  schedule:
    - cron: '0 8 * * *'  # her gun 08:00 UTC
  workflow_dispatch:
  # push tetikleyicisi kaldirildi: her calisma 11 uretim harcar, test hesabinin 30/gun limiti 3 push'ta doluyordu

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Ogretmen materyal araclarini test et
        env:
          NEXT_PUBLIC_SITE_URL: https://www.karemux.com
          OGRETMEN_TEST_EPOSTA: ${{ secrets.OGRETMEN_TEST_EPOSTA }}
          OGRETMEN_TEST_SIFRE: ${{ secrets.OGRETMEN_TEST_SIFRE }}
          OGRETMEN_TEST_SONUC_ANAHTARI: ${{ secrets.OGRETMEN_TEST_SONUC_ANAHTARI }}
        run: node scripts/ogretmen-test.js
