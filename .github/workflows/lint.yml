name: Lint

# Her push ve PR'da ESLint calisir (Vercel derlemesinde "no-control-regex" gibi hatalar ancak
# deploy sirasinda yakalaniyordu). Hata varsa bu is akisi kirmizi olur.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx eslint app lib --ext .js,.jsx --max-warnings=100000
